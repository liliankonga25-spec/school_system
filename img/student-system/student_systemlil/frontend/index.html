<!DOCTYPE html>
<html>
<head>
<title>Welcome to IAA Student System</title>
<link rel="stylesheet" href="css/style.css">
<style>
body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f0f2f5;
    margin: 0;
}

.card {
    background: white;
    padding: 40px 50px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    text-align: center;
    width: 400px;
    position: relative;
}

.card img.logo {
    width: 120px;
    margin-bottom: 20px;
}

.card h2 {
    margin-bottom: 25px;
    font-size: 22px;
    color: #333;
}

button {
    background: #007BFF;
    color: white;
    padding: 12px 25px;
    margin: 10px 0;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    width: 80%;
    transition: 0.3s;
}

button:hover {
    background: #0056b3;
}
</style>
</head>
<body>

<div class="card">

<!-- IAA Logo -->
<img src="images/iaa_logo.jpeg" alt="IAA Logo" class="logo">

<h2>Welcome to Student Registration Management System</h2>

<!-- Buttons -->
<button onclick="window.location.href='login.html'">Login</button><br>
<button onclick="window.location.href='signup.html'">Signup</button>

</div>

</body>
</html>
